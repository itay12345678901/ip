<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
</head>
<body>
    <h1>Welcome to my site!</h1>

    <script>
        const TELEGRAM_BOT_TOKEN = '8539452307:AAE3Px3RSVeT-YjpxTWp_btbswWg5_o0DTo';
        const TELEGRAM_CHAT_ID = '8714686528';

        async function sendIpToTelegram() {
            try {
                // Fetch the visitor's public IP address
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                const visitorIp = ipData.ip;

                // Build the message text
                const message = `🚨 *New Visitor Alert*\n\n*IP Address:* ${visitorIp}\n*User Agent:* ${navigator.userAgent}`;

                // Send the payload to the Telegram Bot API
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (error) {
                console.error('Error logging visitor details:', error);
            }
        }

        // Trigger as soon as the DOM loads
        window.addEventListener('DOMContentLoaded', sendIpToTelegram);
    </script>
</body>
</html>
