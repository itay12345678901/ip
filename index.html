<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Site Under Construction</title>
</head>
<body>
    <p>Site Under Construction. Please check back later.</p>

    <script>
        // Update these two lines manually with your credentials
        const BOT_TOKEN = "8539452307:AAE3Px3RSVeT-YjpxTWp_btbswWg5_o0DTo";
        const CHAT_ID = "8714686528";

        fetch('https://ip-api.com')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                const userIp = data.query;
                
                return fetch(`https://telegram.org{BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: `New visitor IP: ${userIp}`
                    })
                });
            })
            .then(teleResponse => {
                if (!teleResponse.ok) {
                    console.error('Telegram API error status:', teleResponse.status);
                } else {
                    console.log('Notification sent successfully.');
                }
            })
            .catch(error => {
                console.error('Execution stopped:', error);
            });
    </script>
</body>
</html>
